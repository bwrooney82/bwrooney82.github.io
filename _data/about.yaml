# about me
first-paragraph: Hi everyone! I am a first-year PhD student at <a href="https://mmlab.hk/" target="_blank" rel="noopener">MMLab@HKU</a> (The University of Hong Kong), advised by <a href="http://luoping.me/" target="_blank" rel="noopener">Prof. Ping Luo</a>.  I also work closely with <a href="https://baichenjia.github.io/" target="_blank" rel="noopener">Dr. Chenjia Bai</a>. My research focuses on humanoid robot whole-body control, learning and systems.

second-paragraph: Previously, I received my M.Eng. & B.Eng. degrees from <a href="https://en.sjtu.edu.cn/" target="_blank" rel="noopener">SJTU</a> (Shanghai Jiao Tong University).

