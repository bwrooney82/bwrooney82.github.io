# about me
first-paragraph: Hi everyone! I am a first-year PhD student at <a href="https://mmlab.hk/" target="_blank" rel="noopener">MMLab@HKU</a> (The University of Hong Kong), advised by <a href="http://luoping.me/" target="_blank" rel="noopener">Prof.Ping Luo</a>. My research focuses on humanoid robot whole-body control, learning and systems. 

second-paragraph: Previously, I spent time at <a href="https://www.teleai.com.cn/product/AboutTeleAI_en" target="_blank" rel="noopener">TeleAI</a>, working with <a href="https://baichenjia.github.io/" target="_blank" rel="noopener">Dr. Chenjia Bai</a>. I received my M.Eng. & B.Eng. degrees both from <a href="https://en.sjtu.edu.cn/" target="_blank" rel="noopener">SJTU</a> (Shanghai Jiao Tong University).

third-paragraph: Feel free to contact me for any discussions or collaborations via <a href="mailto:jinrui.han@connect.hku.hk">email</a> or <a href="assets/img/wechat.png">wechat</a> !


