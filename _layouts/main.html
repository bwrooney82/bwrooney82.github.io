<!DOCTYPE html>

<html lang="en">
    <head>

        <!-- Metadata -->

        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

        <title>{{ site.title }}</title>
        <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="assets/img/favicon.ico?v=20261116-github-cat-transparent"/>
        <link rel="icon" type="image/png" sizes="32x32" href="{{ site.icon_pic }}?v=20261116-github-cat-transparent"/>

    <body>

        <canvas id="canvas"></canvas>

        <!-- Progress bar on top -->
        <div class="progress-bar-container">

        <!-- Back to top button -->
        <a id="back-to-top-button" href="#" aria-label="Back to top"></a>

        <!-- Content -->

            {% include "_sections/research.html" %}
            {% include "_sections/affiliations.html" %}
            {% include "_sections/footer.html" %}

        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
